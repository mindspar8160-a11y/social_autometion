name: "🚧 Work in Progress (Pause All Workflows)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Action:"
        required: true
        default: "resume"
        type: choice
        options:
          - "resume"
          - "pause"

permissions:
  actions: write
  contents: write

jobs:
  manage_workflows:
    name: "Manage Workflows"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Pause or Resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          echo "Selected Action: $ACTION"

          # Pause/resume hone wali workflows (daily.yml bhi included)
          TARGET_WORKFLOWS=(
            "daily.yml"
            "bot.yml"
            "harvest_topics.yml"
            "apply-vox.yml"
            "apply-niche-icons.yml"
            "video-failure-alert.yml"
            "approve.yml"
            "ig-login.yml"
          )

          notify() {
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=$1" > /dev/null || true
            fi
          }

          if [ "$ACTION" = "resume" ]; then
            echo "▶️ RESUMING ALL WORKFLOWS..."
            for wf in "${TARGET_WORKFLOWS[@]}"; do
              if [ -f ".github/workflows/$wf" ]; then
                echo "Enabling workflow: $wf"
                gh workflow enable "$wf" || true
              fi
            done
            notify "✅ Work in Progress Mode DEACTIVATED! Saare workflows (daily.yml samet) wapas ACTIVE hain."
            echo "✅ All workflows resumed successfully."

          elif [ "$ACTION" = "pause" ]; then
            echo "🛑 PAUSING ALL WORKFLOWS..."
            for wf in "${TARGET_WORKFLOWS[@]}"; do
              if [ -f ".github/workflows/$wf" ]; then
                echo "Disabling workflow: $wf"
                gh workflow disable "$wf" || true
              fi
            done

            echo "Cancelling any running jobs..."
            RUNS=$(gh run list --status in_progress --json databaseId -q '.[].databaseId' || true)
            for r in $RUNS; do
              if [ "$r" != "${{ github.run_id }}" ]; then
                echo "Cancelling run ID: $r"
                gh run cancel "$r" || true
              fi
            done

            notify "🚧 Work in Progress Mode ACTIVATED! Saare automatic workflows (daily.yml samet) pause kar diye gaye hain. Resume ke liye is workflow me 'resume' select karke chalao."
            echo "✅ All workflows paused successfully."
          fi
