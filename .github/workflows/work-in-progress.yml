name: "🚧 Work in Progress (Pause All Workflows)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Action:"
        required: true
        default: "pause"
        type: choice
        options:
          - "pause"
          - "resume"

permissions:
  actions: write
  contents: write

jobs:
  manage_workflows:
    name: "Manage Workflows"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Pause or Resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          echo "Selected Action: $ACTION"
          CURRENT_WF="🚧 Work in Progress (Pause All Workflows)"

          if [ "$ACTION" = "pause" ]; then
            echo "🛑 PAUSING ALL WORKFLOWS..."
            
            gh workflow list --json name,id -q '.[] | select(.name != "'"$CURRENT_WF"'") | .id' | while read -r wf_id; do
              echo "Disabling workflow ID: $wf_id"
              gh workflow disable "$wf_id" || true
            done

            echo "Cancelling any running jobs..."
            RUNS=$(gh run list --status in_progress --json databaseId -q '.[].databaseId' || true)
            for r in $RUNS; do
              if [ "$r" != "${{ github.run_id }}" ]; then
                echo "Cancelling run ID: $r"
                gh run cancel "$r" || true
              fi
            done

            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=🚧 *Work in Progress Mode ACTIVATED!*%0A%0ASaare automatic workflows pause kar diye gaye hain." \
                -d "parse_mode=Markdown" > /dev/null || true
            fi
            
            echo "✅ All workflows paused successfully."

          elif [ "$ACTION" = "resume" ]; then
            echo "▶️ RESUMING ALL WORKFLOWS..."

            gh workflow list --json name,id -q '.[] | select(.name != "'"$CURRENT_WF"'") | .id' | while read -r wf_id; do
              echo "Enabling workflow ID: $wf_id"
              gh workflow enable "$wf_id" || true
            done

            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=✅ *Work in Progress Mode DEACTIVATED!*%0A%0ASaare workflows wapas ACTIVE kar diye gaye hain." \
                -d "parse_mode=Markdown" > /dev/null || true
            fi

            echo "✅ All workflows resumed successfully."
          fi
