name: Hourly Studio Reels
on:
  schedule:
    # 4 Peak Viral Slots in India (IST = UTC + 5:30):
    # 1. 08:30 AM IST (03:00 UTC) - Morning Commute & Puja Peak
    # 2. 01:00 PM IST (07:30 UTC) - Afternoon Lunch Break Peak
    # 3. 05:30 PM IST (12:00 UTC) - Evening Prime Time Peak
    # 4. 08:30 PM IST (15:00 UTC) - Dinner / Night Relax Peak
    # Raat (10:00 PM se 08:00 AM IST) video generate/upload band rahega.
    - cron: "0 3,12,15 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:             # manual trigger button anytime
    inputs:
      force:
        description: "Force run (bypass 45-min guard)"
        type: boolean
        default: false
      mode:
        description: "Video Mode: myth (MindSpark Mythology & Puppet) or book (Books & Wisdom)"
        type: choice
        options:
          - myth
          - book
        default: myth
      book:
        description: "Custom Topic or Book Name (Leave empty for automatic)"
        type: string
        default: ""

concurrency:
  group: studio-video
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      # ── Guard: Night Sleep Guard (10 PM - 8 AM IST) & 45-min double-run guard ──
      - name: Guard against night hours and double runs
        id: guard
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⚡ Manual trigger detected. Bypassing night & double-run guard."
          else
            NOW_UTC=$(date -u +%s)
            NOW_IST=$(( NOW_UTC + 19800 ))
            IST_HOUR=$(date -u -d "@$NOW_IST" +%H)
            IST_HOUR=$((10#$IST_HOUR))
            if [ "$IST_HOUR" -ge 22 ] || [ "$IST_HOUR" -lt 8 ]; then
              echo "🌙 Raat ka samay hai (${IST_HOUR}:00 IST). Audience offline hoti hai. Video generation & upload BAND."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ -f data/pending_video.json ]; then
              TS=$(python3 -c "import json; print(json.load(open('data/pending_video.json')).get('timestamp',0))")
              DIFF=$(( NOW_UTC - TS ))
              if [ "$DIFF" -lt 2700 ]; then
                echo "⏭️ Video created ${DIFF}s ago (< 45 min). Skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: { node-version: "20" }

      - if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -U -r requirements.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu || true
          pip install -U transformers accelerate pydub soundfile || true

      # ── Cache XTTS-v2 Local Model weights so it loads instantly from cache ──
      - name: Cache XTTS-v2 Local Model
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tts
            ~/.cache/huggingface
          key: xtts-v2-weights-v1
          restore-keys: |
            xtts-v2-weights-

      - name: Pre-flight XTTS-v2 Cache Check
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/ensure_xtts_model.py

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            remotion/node_modules
            ~/.cache/remotion
            remotion/node_modules/.remotion
          key: remotion-${{ hashFiles('remotion/package.json') }}
          restore-keys: remotion-

      - if: steps.guard.outputs.skip != 'true'
        run: npm install --no-audit --no-fund
        working-directory: remotion

      - if: steps.guard.outputs.skip != 'true'
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Prepare Myth Audio Assets
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/make-myth-audio.mjs

      - name: Verify Telegram Secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os
          t = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          c = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          print('Telegram Bot Token present:', bool(t), f'({len(t)} chars)')
          print('Telegram Chat ID present:', bool(c), f'({c[:3]}***{c[-2:] if len(c)>2 else \"\"})')
          if not (t and c):
              print('::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing from GitHub Secrets!')
          "

      - name: Make Reel Video
        if: steps.guard.outputs.skip != 'true'
        env:
          AUTO_UPLOAD: "1"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_STYLE: ${{ secrets.LLM_API_STYLE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-myth}"
          if [ -n "${{ inputs.book }}" ]; then
            python src/daily_pipeline.py --headless --mode "$MODE" --book "${{ inputs.book }}"
          else
            python src/daily_pipeline.py --headless --mode "$MODE"
          fi

      # ── Direct upload: PASS ka intezaar nahi, video seedha YouTube pe ──
      - name: Upload to YouTube (direct)
        id: yt
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
        run: python src/youtube_upload.py data/output/*/

      - name: Telegram alert if upload failed
        if: steps.guard.outputs.skip != 'true' && steps.yt.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ YouTube auto-upload fail hua. GitHub Actions ka log dekho."
          else
            echo "Telegram secrets not set, skipping failure alert."
          fi

      # ── Upload to Instagram via Buffer (1-to-1 with YouTube, Every Single Video) ──
      - name: Upload to Instagram (via Buffer API)
        id: ig_buffer
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/buffer_upload.py data/output/*/

      # ── run_id save karo taaki bot artifact se full-quality video utha sake ──
      - name: Stamp run id into pending_video.json
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 - <<'PYEOF'
          import json, os
          p = "data/pending_video.json"
          if os.path.exists(p):
              d = json.load(open(p, encoding="utf-8"))
              d["run_id"] = os.environ["GITHUB_RUN_ID"]
              json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("run_id stamped:", d["run_id"])
          else:
              print("pending_video.json not found, skipping")
          PYEOF

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: data/output
          retention-days: 7

      - name: Build Mobile Review Website
        if: steps.guard.outputs.skip != 'true'
        run: python src/review_app/build_pages_site.py ${{ github.run_id }}

      - name: Upload Pages Artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Remember theme, template, style and myth history
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/theme_history.json data/template_history.json data/pending_video.json data/style_history.json state/recent-styles.json data/myth_history.json data/active_series.json data/rendered_parts_history.json completed_books.md; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "theme, template, style and pending video [skip ci]"
            # Clean untracked and unstaged files so git pull never fails with "You have unstaged changes"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase -Xtheirs origin main || (git rebase --abort 2>/dev/null || true; git pull --no-rebase -Xtheirs origin main --no-edit) || true
            # push retry: history kho na jaye (warna kahani repeat ho sakti hai)
            for i in 1 2 3; do
              git push origin main && break
              echo "push retry $i"
              git pull --rebase -Xtheirs origin main || true
              sleep 5
            done
          fi
